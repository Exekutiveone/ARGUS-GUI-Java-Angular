<div class="dashboard">
  <header class="topbar">
    <div>
      <h1>ARGUS Command Center</h1>
      <span>Remote Vehicle Dashboard</span>
    </div>
    <button type="button" (click)="logout()">Logout</button>
  </header>

  <main class="layout" *ngIf="telemetry as data; else loading">
    <section class="panel map">
      <app-map
        [latitude]="data.position.lat"
        [longitude]="data.position.lon"
        [timestamp]="data.timestamp"
      ></app-map>
    </section>

    <section class="panel compass">
      <app-compass [heading]="heading"></app-compass>
    </section>

    <section class="panel model">
      <app-car-model [orientation]="orientation"></app-car-model>
    </section>

    <section class="panel camera">
      <app-camera
        *ngIf="mainFeed; else cameraFallback"
        [mainFeed]="mainFeed"
        [secondaryFeeds]="secondaryFeeds"
        [recActive]="true"
        (selectFeed)="selectCamera($event)"
      ></app-camera>
    </section>

    <section class="panel tasks">
      <div class="tasks-switch">
        <label for="tasks-select">Ansicht</label>
        <select id="tasks-select" [(ngModel)]="taskPanelView">
          <option value="tasks">Aufgaben</option>
          <option value="calibration">Kalibrierung</option>
        </select>
      </div>
      <div class="tasks-body" [ngSwitch]="taskPanelView">
        <app-tasks *ngSwitchCase="'tasks'" [tasks]="tasks"></app-tasks>
        <app-calibration *ngSwitchCase="'calibration'"></app-calibration>
      </div>
    </section>

    <section class="panel controls">
      <app-controls
        [pressedKeys]="pressedKeys"
        [throttleLevel]="throttleLevel"
        [brakeLevel]="brakeLevel"
        [controllerConnected]="controllerConnected"
        [leftStick]="leftStick"
        [rightStick]="rightStick"
        [ledIntensity]="ledIntensity"
        [ledFrontActive]="ledFrontActive"
        [ledSweepActive]="ledSweepActive"
        [laserFrontActive]="laserFrontActive"
        [laserSweepActive]="laserSweepActive"
        [driveModes]="driveModes"
        [steeringModes]="steeringModes"
        [driveMode]="driveMode"
        [steeringMode]="steeringMode"
        (driveModeChange)="changeDriveMode($event)"
        (steeringModeChange)="changeSteeringMode($event)"
      ></app-controls>
    </section>

    <section class="panel sensors">
      <app-sensors
        [temperatures]="data.temperatures"
        [accelerationSeries]="data.acceleration"
        [brakeSeries]="data.braking"
        [speed]="data.speed"
        [battery]="data.battery"
      ></app-sensors>
    </section>
  </main>

  <ng-template #loading>
    <div class="loading">Telemetry wird initialisiert…</div>
  </ng-template>
</div>

<ng-template #cameraFallback>
  <div class="camera-placeholder">Kamerafeeds werden geladen…</div>
</ng-template>
